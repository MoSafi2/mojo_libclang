[workspace]
authors = ["MoSafi2 <mohamed.mabrouk@rwth-aachen.de>"]
channels = ["conda-forge", "https://conda.modular.com/max-nightly", "https://repo.prefix.dev/modular-community"]
name = "mojo_libclang"
platforms = ["linux-64", "linux-aarch64", "osx-arm64"]
preview = ["pixi-build"]
version = "0.3.0.dev20261031"

[package]
name = "libclang_mojo"
version = "0.3.0.dev20261031"

[package.build]
backend = { name = "pixi-build-mojo", version = "0.*", channels = ["conda-forge", "https://conda.modular.com/max-nightly"] }

[package.build.config.pkg]
name = "clang"
path = "clang"

[package.host-dependencies]
libclang = "18.*"
mojo-compiler = "=1.3.0.dev2026103105"

[package.build-dependencies]
mojo-compiler = "=1.3.0.dev2026103105"

[package.run-dependencies]
libclang = "18.*"
mojo-compiler = "=1.3.0.dev2026103105"

[dependencies]
mojo = "=1.3.0.dev2026103105"
libclang = "18.*"

[tasks]
run-test = "mojo run -I ."
build-test = "mojo build -I ."

[feature.dev.dependencies]
python = ">=3.14.5,<3.15"
clangdev = "18.*"

[feature.dev.pypi-dependencies]
mojo-bindgen = { git = "git+https://github.com/MoSafi2/mojo_bindgen", rev = "ad2ae77898a738ac88d7d4b9b4d87ca96e874790" }

[feature.dev.tasks]
generate = "python scripts/generate_libclang_bindings.py"
generate-libclang = "python scripts/generate_libclang_bindings.py"
build-package = "bash scripts/build_package_layout.sh dist/libclang_mojo-prefix"
build-package-layout = "bash scripts/build_package_layout.sh dist/libclang_mojo-prefix"
test = "python scripts/run_tests.py"
check-generated = "python scripts/check_generated.py"
check-consumer = { cmd = "python scripts/check_consumer.py", depends-on = ["build-package-layout"] }
run-consumer = { cmd = "python scripts/check_consumer.py", depends-on = ["build-package-layout"] }

[feature.package.dependencies]
rattler-build = ">=0.67.0,<0.68"

[feature.package.tasks]
render-recipe = "bash scripts/build_recipe.sh --render-only"
build-recipe = "bash scripts/build_recipe.sh"
upload-recipe = "bash scripts/upload_recipe.sh"
check-conda-consumer = "python scripts/check_conda_consumer.py"

[feature.docs.dependencies]
nodejs = ">=25.7.0,<26"

[feature.docs.pypi-dependencies]
pymodo = ">=0.11.12,<0.12"

[feature.docs.tasks]
docs = "modo build && cd docs/site && npm ci && node scripts/add-frontmatter.mjs && npm run build"
docs-serve = "modo build && cd docs/site && npm ci && node scripts/add-frontmatter.mjs && npm run dev"

[environments]
default = ["dev"]
runtime = []
dev = ["dev"]
package = ["dev", "package"]
docs = ["docs"]
