# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
context:
  version: "0.2.0"
  mojo_version: "==1.2.0"
  llvm_version: "18.*"
  rev: "6d7ce1973f8815f30f20a6271a2dc0c55445e010"

package:
  name: "libclang_mojo"
  version: ${{ version }}

source:
  - git: https://github.com/MoSafi2/mojo_libclang.git
    rev: ${{ rev }}

build:
  number: 0
  string: "mojo1_2_0_${{ target_platform | replace('-', '_') }}_0"
  script:
    interpreter: bash
    content:
      - |
        set -euo pipefail
        mkdir -p "${PREFIX}/lib" "${PREFIX}/lib/mojo"
        if [[ "$(uname -s)" == "Darwin" ]]; then
          "${CC}" -dynamiclib \
            "-DMOJO_LIBCLANG_RUNTIME_PATH=\"${PREFIX}/lib/libclang.dylib\"" \
            -I"${PREFIX}/include" -Ishim \
            -o "${PREFIX}/lib/libclang_mojo_shim.dylib" \
            shim/libclang_mojo_shim.c \
            -L"${PREFIX}/lib" -lclang \
            -Wl,-rpath,"${PREFIX}/lib"
        else
          "${CC}" -shared -fPIC \
            "-DMOJO_LIBCLANG_RUNTIME_PATH=\"${PREFIX}/lib/libclang.so\"" \
            -I"${PREFIX}/include" -Ishim \
            -o "${PREFIX}/lib/libclang_mojo_shim.so" \
            shim/libclang_mojo_shim.c \
            -L"${PREFIX}/lib" -lclang \
            -Wl,-rpath,"${PREFIX}/lib"
        fi
        mojo precompile clang -o "${PREFIX}/lib/mojo/clang.mojoc"

requirements:
  build:
    - ${{ compiler('c') }}
    - mojo-compiler ${{ mojo_version }}
  host:
    - clangdev ${{ llvm_version }}
    - libclang ${{ llvm_version }}
    - mojo-compiler ${{ mojo_version }}
  run:
    - libclang ${{ llvm_version }}
    - mojo-compiler ${{ mojo_version }}

tests:
  - files:
      recipe:
        - test_cindex_smoke.mojo
    script:
      interpreter: bash
      content:
        - |
          set -euo pipefail
          printf 'int add(int a, int b) { return a + b; }\n' > api.c
          cp api.c api.cpp
          printf 'int broken = ;\n' > invalid.c
          mojo build -I "${PREFIX}/lib/mojo" test_cindex_smoke.mojo -o package-smoke
          ./package-smoke

about:
  homepage: https://github.com/MoSafi2/mojo_libclang
  license: MIT
  license_file: LICENSE
  summary: High-level Mojo bindings for LLVM libclang
  repository: https://github.com/MoSafi2/mojo_libclang

extra:
  maintainers:
    - MoSafi2
  project_name: mojo_libclang
