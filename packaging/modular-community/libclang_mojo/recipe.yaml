# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
context:
  version: "0.2.0"
  mojo_version: "==1.2.0"
  llvm_version: "18.*"
  rev: "d4d7c267b82a23a96676b5d301b8ebe405180b27"

package:
  name: "libclang_mojo"
  version: ${{ version }}

source:
  - git: https://github.com/MoSafi2/mojo_libclang.git
    rev: ${{ rev }}

build:
  number: 1
  string: "mojo1_2_0_${{ target_platform | replace('-', '_') }}_1"
  script:
    interpreter: bash
    content:
      - |
        set -euo pipefail
        mkdir -p "${PREFIX}/lib" "${PREFIX}/lib/mojo"
        mojo precompile clang -o "${PREFIX}/lib/mojo/clang.mojoc"

requirements:
  build:
    - mojo-compiler ${{ mojo_version }}
  host:
    - libclang ${{ llvm_version }}
    - mojo-compiler ${{ mojo_version }}
  run:
    - libclang ${{ llvm_version }}
    - mojo-compiler ${{ mojo_version }}

tests:
  - files:
      recipe:
        - test_cindex_smoke.mojo
    script:
      interpreter: bash
      content:
        - |
          set -euo pipefail
          printf 'struct Point { int x; int y; };\nint add(int a, int b) { return a + b; }\n' > api.c
          cp api.c api.cpp
          printf 'int broken = ;\n' > invalid.c
          for ((i=0; i<5000; ++i)); do printf 'int child_%s;\n' "$i"; done > many_children.c
          mojo build -I "${PREFIX}/lib/mojo" test_cindex_smoke.mojo -o package-smoke
          ./package-smoke

about:
  homepage: https://github.com/MoSafi2/mojo_libclang
  license: MIT
  license_file: LICENSE
  summary: High-level Mojo bindings for LLVM libclang
  repository: https://github.com/MoSafi2/mojo_libclang

extra:
  maintainers:
    - MoSafi2
  project_name: mojo_libclang
